<button class="absolute right-3 top-2.5 text-on-surface-variant hover:text-primary" onclick="toggleVisibility('current_password')" type="button">
<span class="material-symbols-outlined text-sm">visibility</span>
</button>
</div>
</div>
<!-- Divider with requirements hint -->
<div class="py-2 flex items-center gap-md">
<div class="h-[1px] flex-grow bg-border-subtle"></div>
<span class="font-status-pill text-status-pill text-on-surface-variant opacity-60 uppercase">New Credentials</span>
<div class="h-[1px] flex-grow bg-border-subtle"></div>
</div>
<!-- New Password -->
<div class="space-y-base">
<label class="block font-label-md text-label-md text-on-surface-variant" for="new_password">New Password</label>
<div class="relative group">
<input class="w-full h-10 px-md border-border-subtle rounded border focus:border-secondary focus:ring-0 transition-all text-body-md" id="new_password" minlength="8" placeholder="At least 8 characters" required="" type="password"/>
<button class="absolute right-3 top-2.5 text-on-surface-variant hover:text-primary" onclick="toggleVisibility('new_password')" type="button">
<span class="material-symbols-outlined text-sm">visibility</span>
</button>
</div>
<!-- Real-time feedback container -->
<div class="flex flex-wrap gap-x-md gap-y-1 mt-2" id="password-requirements">
<div class="flex items-center gap-1 text-[11px] font-semibold text-status-error transition-colors" id="req-length">
<span class="material-symbols-outlined text-[14px]">circle</span> 8+ Characters
                        </div>
<div class="flex items-center gap-1 text-[11px] font-semibold text-status-error transition-colors" id="req-complex">
<span class="material-symbols-outlined text-[14px]">circle</span> Mix of letters/numbers
                        </div>
</div>

<!-- Confirm New Password -->
<div class="space-y-base">

<!-- Script for interaction -->
<script>
        function toggleVisibility(id) {
            const input = document.getElementById(id);
            const icon = input.nextElementSibling.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        const newPwd = document.getElementById('new_password');
        const confPwd = document.getElementById('confirm_password');
        const reqLength = document.getElementById('req-length');
        const reqComplex = document.getElementById('req-complex');
        const matchError = document.getElementById('match-error');

        newPwd.addEventListener('input', () => {
            const val = newPwd.value;
            // Length check
            if (val.length >= 8) {
                reqLength.classList.replace('text-status-error', 'text-status-success');
                reqLength.querySelector('.material-symbols-outlined').innerText = 'check_circle';
            } else {
                reqLength.classList.replace('text-status-success', 'text-status-error');
                reqLength.querySelector('.material-symbols-outlined').innerText = 'circle';
            }
            // Complexity check (simple regex for letters and numbers)
            if (/[A-Za-z]/.test(val) && /[0-9]/.test(val)) {
                reqComplex.classList.replace('text-status-error', 'text-status-success');
                reqComplex.querySelector('.material-symbols-outlined').innerText = 'check_circle';
            } else {
                reqComplex.classList.replace('text-status-success', 'text-status-error');
                reqComplex.querySelector('.material-symbols-outlined').innerText = 'circle';
            }
        });

        confPwd.addEventListener('input', () => {
            if (confPwd.value !== newPwd.value && confPwd.value !== '') {
                matchError.classList.remove('hidden');
                confPwd.classList.add('border-status-error');
            } else {
                matchError.classList.add('hidden');
                confPwd.classList.remove('border-status-error');
            }
        });

        function handleUpdate(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Interaction: Loading State
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin material-symbols-outlined">sync</span> <span>Processing...</span>`;
            
            setTimeout(() => {
                btn.classList.replace('bg-secondary', 'bg-status-success');
                btn.innerHTML = `<span class="material-symbols-outlined">check</span> <span>Success</span>`;
                setTimeout(() => {
                    alert('Password updated successfully. Redirecting to Dashboard...');
                    // In a real app: window.location.href = '/dashboard';
                }, 800);
            }, 1500);
            
            return false;
        }
    </script>
